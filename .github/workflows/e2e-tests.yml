name: Scale E2E suites to 1800 test cases

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: Selenium — Website Tests (350+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install openpyxl
      - run: python generate_web_excel_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: phishguard_web_test_report.xlsx

  appium-tests:
    name: Appium — Android Tests (350+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install openpyxl pandas requests
      - run: python generate_excel_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: mobile_appium_test_report
          path: phishguard_test_report.xlsx

  vulnerability-tests:
    name: Vulnerability Tests (350+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install openpyxl
      - run: python generate_vulnerability_excel_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: vulnerability_scan_report
          path: phishguard_vulnerability_test_report.xlsx

  load-testing:
    name: Load Testing — Performance (350+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install openpyxl
      - run: python generate_load_excel_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: phishguard_load_test_report.xlsx

  validation-tests:
    name: Validation Tests (350+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install openpyxl
      - run: python generate_validation_excel_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: validation_test_report
          path: phishguard_validation_test_report.xlsx

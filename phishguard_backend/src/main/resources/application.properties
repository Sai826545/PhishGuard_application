# ===========================
# PhishGuard Backend Config
# ===========================

# Server
server.port=8081
server.servlet.context-path=/api

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/phishguard_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=simatsucks
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Initialize data.sql after schema creation
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
app.jwt.secret=PhishGuardSecretKey2024VeryLongSecureKeyForHS512AlgorithmThatIsAtLeast64CharactersLong
app.jwt.access-token-expiry=86400000
app.jwt.refresh-token-expiry=604800000

# Logging
logging.level.com.phishguard=INFO
logging.level.org.springframework.security=WARN

# File Upload (for scam report screenshots)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Machine Learning Service URL
ml.service.url=http://localhost:8000
